{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="form-caixa">
  <h1 class="titulo-secao text-center">Criar conta</h1>
  <form method="post" class="cartao">
    <label class="form-label">Nome</label>
    <input name="nome" class="form-control campo mb-3" value="{{ request.form.nome }}" required minlength="2">
    <label class="form-label">E-mail</label>
    <input type="email" name="email" class="form-control campo mb-3" value="{{ request.form.email }}" required>
    <label class="form-label">Senha (mín. 6)</label>
    <input type="password" name="senha" class="form-control campo mb-3" required minlength="6">
    <label class="form-label">Escolha um avatar</label>
    <div class="avatares mb-3">
      {% for a in avatares %}
        <label><input type="radio" name="avatar" value="{{ a }}" {% if loop.first %}checked{% endif %}><span>{{ a }}</span></label>
      {% endfor %}
    </div>
    <button class="btn btn-game w-100">Criar conta</button>
  </form>
  <p class="text-center mt-3 texto-suave">Já tem conta? <a href="{{ url_for('login') }}" class="link-neon">Entrar</a></p>
</div>
{% endblock %}
