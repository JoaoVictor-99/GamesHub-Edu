{% extends "base.html" %}
{% block titulo %}Editar perfil{% endblock %}
{% block conteudo %}
<div class="form-caixa">
  <h1 class="titulo-secao">Editar perfil</h1>
  <form method="post" class="cartao">
    <label class="form-label">Nome</label>
    <input name="nome" class="form-control campo mb-3" value="{{ g.usuario.nome }}" required minlength="2">
    <label class="form-label">Avatar</label>
    <div class="avatares mb-3">
      {% for a in avatares %}
        <label><input type="radio" name="avatar" value="{{ a }}" {% if a == g.usuario.avatar %}checked{% endif %}><span>{{ a }}</span></label>
      {% endfor %}
    </div>
    <button class="btn btn-game w-100">Salvar</button>
  </form>
  <form method="post" action="{{ url_for('excluir_conta') }}" class="cartao mt-3 zona-perigo" onsubmit="return confirm('Excluir sua conta e todas as partidas? Isso não pode ser desfeito.')">
    <strong>Zona de perigo</strong>
    <p class="small texto-suave mb-2">Excluir a conta apaga também todo o seu histórico.</p>
    <button class="btn btn-perigo btn-sm">Excluir minha conta</button>
  </form>
</div>
{% endblock %}
