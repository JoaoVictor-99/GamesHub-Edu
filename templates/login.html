{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="form-caixa">
  <h1 class="titulo-secao text-center">Entrar</h1>
  <form method="post" class="cartao">
    <label class="form-label">E-mail</label>
    <input type="email" name="email" class="form-control campo mb-3" value="{{ request.form.email }}" required>
    <label class="form-label">Senha</label>
    <input type="password" name="senha" class="form-control campo mb-3" required>
    <button class="btn btn-game w-100">Entrar</button>
  </form>
  <p class="text-center mt-3 texto-suave">Não tem conta? <a href="{{ url_for('cadastro') }}" class="link-neon">Criar agora</a></p>
</div>
{% endblock %}
